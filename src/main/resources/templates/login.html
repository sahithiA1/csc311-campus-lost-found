<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Campus Lost & Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1e293b;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .message {
            text-align: center;
            color: green;
        }
        .error {
            text-align: center;
            color: #dc2626;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Campus Lost & Found</h2>
    <h3 style="text-align:center;">Sign In</h3>

    <p class="message" th:if="${param.registered}">
        Account created. Please sign in.
    </p>

    <p class="error" th:if="${param.error}">
        Wrong username or password.
    </p>

    <p class="message" th:if="${param.logout}">
        You have signed out.
    </p>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username"
               name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               name="password" required>

        <button type="submit">Sign in</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a th:href="@{/register}">Register</a>
    </div>
</div>
</body>
</html>
